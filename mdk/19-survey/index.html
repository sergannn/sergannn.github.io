<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Анкета читателя</title>
  <link rel="stylesheet" href="../style.css">
</head>
<body style="--accent: #8b4a27">
  <header id="site-header" class="site-header">
    <nav id="site-nav" class="site-nav" aria-label="Навигация"><a class="home-link" href="../index.html">Все сайты</a></nav>
    <h1 id="site-title" class="site-title">Анкета читателя</h1>
  </header>
  <main id="main-content" class="main-content">
<p id="form-note" class="note">Учебная анкета. Ответы остаются в адресной строке этой страницы.</p><form id="reader-form" class="survey" action="index.html" method="get"><div class="field"><label for="reader-name">Ваше имя</label><input id="reader-name" class="text-input" name="name" type="text" required></div><div class="field"><label for="genre">Любимый жанр</label><select id="genre" class="select-input" name="genre"><option value="stories">Рассказы</option><option value="fantasy">Фантастика</option><option value="science">Наука</option></select></div><fieldset id="frequency" class="radio-group"><legend>Как часто вы читаете?</legend><label><input id="daily" class="radio-input" type="radio" name="frequency" value="daily" checked> Каждый день</label><label><input id="weekly" class="radio-input" type="radio" name="frequency" value="weekly"> Раз в неделю</label></fieldset><button id="submit-survey" class="button" type="submit">Готово</button></form>
  </main>
  <footer id="site-footer" class="site-footer"><p class="footer-text">Учебный сайт · МДК</p></footer>
</body>
</html>
