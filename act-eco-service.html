<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Акт выполненных работ ООО Экология-Сервис</title>
  <style>
    :root {
      --green: #7fb31e;
      --dark: #202020;
      --muted: #65705f;
      --line: #dfe8d6;
      --paper: #fff;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 32px 18px;
      font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
      color: var(--dark);
      background: #f6f9f1;
    }
    main {
      width: min(720px, 100%);
      padding: 36px;
      background: var(--paper);
      border: 1px solid var(--line);
      border-radius: 12px;
      box-shadow: 0 18px 60px rgba(37, 54, 28, .12);
    }
    h1 {
      margin: 0 0 12px;
      font-size: clamp(28px, 5vw, 42px);
      line-height: 1.12;
    }
    p {
      margin: 0 0 24px;
      max-width: 58ch;
      color: var(--muted);
    }
    a.button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 48px;
      padding: 0 22px;
      border-radius: 20px 1px;
      background: var(--dark);
      color: #fff;
      font-weight: 700;
      text-decoration: none;
    }
    a.button:hover { background: var(--green); }
    .meta {
      margin-top: 18px;
      font-size: 13px;
      color: var(--muted);
    }
  </style>
</head>
<body>
  <main>
    <h1>Акт выполненных работ</h1>
    <p>ООО «Экология-Сервис». Документ подготовлен для скачивания в формате DOCX.</p>
    <a class="button" href="act-eco-service.docx" download>Скачать акт</a>
    <div class="meta">Файл: act-eco-service.docx</div>
  </main>
</body>
</html>
