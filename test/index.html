<html>
   <button id="github-btn">Войти через GitHub</button>
  <p id="status"></p>

  
<script type="module">
  // Import the functions you need from the SDKs you need
  import { initializeApp } from "https://www.gstatic.com/firebasejs/13.4.0/firebase-app.js";
  import { getAnalytics } from "https://www.gstatic.com/firebasejs/13.4.0/firebase-analytics.js";

    import { getAuth, signInWithPopup, GithubAuthProvider } from "https://www.gstatic.com/firebasejs/13.4.0/firebase-auth.js";
  // TODO: Add SDKs for Firebase products that you want to use
  // https://firebase.google.com/docs/web/setup#available-libraries

  // Your web app's Firebase configuration
  // For Firebase JS SDK v7.20.0 and later, measurementId is optional
  const firebaseConfig = {
    apiKey: "AIzaSyCKJa-h1axWCRvRl2SQ44hZi-8NbrY6siA",
    authDomain: "test2novgorod.firebaseapp.com",
    projectId: "test2novgorod",
    storageBucket: "test2novgorod.firebasestorage.app",
    messagingSenderId: "503876303261",
    appId: "1:503876303261:web:b667af3f49d1659694d774",
    measurementId: "G-0ES086ENEQ"
  };

  // Initialize Firebase
  const app = initializeApp(firebaseConfig);
  const analytics = getAnalytics(app);
  const auth = getAuth(app);
  const provider = new GithubAuthProvider(); // Создаем провайдер GitHub [1]

    // Обработчик клика на кнопку
    document.getElementById("github-btn").addEventListener("click", function() {
      // Открываем всплывающее окно для входа [1]
      signInWithPopup(auth, provider)
        .then((result) => {
          const user = result.user; // Получаем данные пользователя [1]
          document.getElementById("status").innerText = `Привет, ${user.displayName || user.email}!`;
        })
/*        .catch((error) => {
          console.error("Ошибка входа:", error);
          document.getElementById("status").innerText = `Ошибка: ${error.message}`; // Обработка ошибок [1]
        });*/
    });
  
</script>
</html>
